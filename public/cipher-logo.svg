<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer circular arc with opening for arrow -->
  <path
    d="M 68 25 A 38 38 0 1 0 78 68"
    stroke="#0b3558"
    stroke-width="5.5"
    stroke-linecap="round"
  />
  
  <!-- Inner concentric circular arc -->
  <path
    d="M 60 38 A 27 27 0 1 0 72 58"
    stroke="#0b3558"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Bottom-right inner hook / G spur -->
  <path
    d="M 72 58 L 56 58"
    stroke="#0b3558"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Growth zigzag line -->
  <path
    d="M 32 68 L 50 48 L 58 56 L 76 30"
    stroke="#0b3558"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Arrowhead pointing up-right -->
  <path
    d="M 86 18 L 86 38 L 76 30 L 68 40 Z"
    fill="#0b3558"
    stroke="#0b3558"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
</svg>
